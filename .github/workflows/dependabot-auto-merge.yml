name: Dependabot Auto-Merge

# pull_request is enough: Dependabot branches live in this repository, and the permissions block below
# gives the token what the job needs. pull_request_target is blocked by default in public repositories
# from 2026-12-02.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
